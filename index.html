/* أسفاري — the look of a passport: cool security paper, visa-stamp inks, Kufi lettering. */
:root {
  --paper: #EDF2F1;      /* page: cool, faintly green security paper */
  --paper-2: #E2E9E8;
  --sheet: #FFFFFF;      /* cards, sheets */
  --ink: #1A2440;        /* text: passport ink */
  --ink-2: #4C5873;
  --ink-3: #7C879E;
  --rule: #D2DCDB;
  --visa: #4B44C8;       /* visited — the violet of entry stamps */
  --visa-2: #3A33A8;
  --visa-soft: #E4E2FA;
  --carmine: #C2362F;    /* home, warnings */
  --carmine-soft: #F8E1DF;
  --emerald: #13785A;    /* lived */
  --emerald-soft: #DDF0E8;
  --saffron: #C98A12;    /* wishlist, badges */
  --saffron-soft: #F7EBCF;
  --slate: #7D8AA6;      /* transit */
  --land: #D3DCDB;       /* countries not visited yet */
  --sea: #EDF2F1;
  --shadow: 0 1px 0 rgba(26, 36, 64, .05), 0 10px 30px -18px rgba(26, 36, 64, .45);
  --r-lg: 20px; --r-md: 14px; --r-sm: 9px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: "Plex Arabic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --kufi: "Reem Kufi", "Plex Arabic", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #0D1322; --paper-2: #121A2D; --sheet: #161E33; --ink: #E7ECF5; --ink-2: #A7B1C8; --ink-3: #78839C; --rule: #263049;
  --visa: #8D86FF; --visa-2: #A7A1FF; --visa-soft: #26244F; --carmine: #FF6B5E; --carmine-soft: #3B1F24;
  --emerald: #38C596; --emerald-soft: #15352C; --saffron: #F0BB49; --saffron-soft: #3A2F16; --slate: #8794B3;
  --land: #2A3450; --sea: #0D1322;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -18px rgba(0, 0, 0, .9);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1322; --paper-2: #121A2D; --sheet: #161E33; --ink: #E7ECF5; --ink-2: #A7B1C8; --ink-3: #78839C; --rule: #263049;
    --visa: #8D86FF; --visa-2: #A7A1FF; --visa-soft: #26244F; --carmine: #FF6B5E; --carmine-soft: #3B1F24;
    --emerald: #38C596; --emerald-soft: #15352C; --saffron: #F0BB49; --saffron-soft: #3A2F16; --slate: #8794B3;
    --land: #2A3450; --sea: #0D1322;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -18px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55;
  -webkit-text-size-adjust: 100%; text-rendering: optimizeLegibility; overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--visa); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
img.flag { width: 28px; height: 21px; border-radius: 3px; object-fit: cover; box-shadow: 0 0 0 1px rgba(26, 36, 64, .12); flex: none; background: var(--paper-2); }
img.flag.lg { width: 56px; height: 42px; border-radius: 6px; }
img.flag.sm { width: 20px; height: 15px; border-radius: 2px; }

/* boot */
.boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
.boot-mark { font-family: var(--kufi); font-size: 44px; color: var(--visa); letter-spacing: 0; animation: bootpulse 1.6s ease-in-out infinite; }
@keyframes bootpulse { 50% { opacity: .45; } }

/* ---------- app frame ---------- */
.screen { min-height: 100vh; min-height: 100dvh; padding-bottom: calc(var(--nav-h) + var(--safe-b) + 24px); overflow-x: clip; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--paper); background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: calc(var(--safe-t) + 10px) 0 10px; border-bottom: 1px solid transparent;
}
.topbar.scrolled { border-bottom-color: var(--rule); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.topbar h1 { font-family: var(--kufi); font-weight: 700; font-size: 26px; line-height: 1.2; margin: 0; flex: 1; letter-spacing: 0; }
.topbar h1.sub { font-size: 21px; }
.iconbtn {
  width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); flex: none;
}
.iconbtn:active { background: var(--paper-2); }
.iconbtn svg { width: 23px; height: 23px; }
[dir="rtl"] .flip { transform: scaleX(-1); }

nav.tabs {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 40; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: var(--sheet); border-top: 1px solid var(--rule); display: flex; justify-content: center;
}
nav.tabs .in { display: flex; width: 100%; max-width: 680px; }
nav.tabs button {
  flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11.5px; font-weight: 500; color: var(--ink-3); position: relative;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--visa); }
nav.tabs button[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--visa);
}

.fab {
  position: fixed; z-index: 35; inset-inline-end: max(16px, calc((100vw - 680px) / 2 + 16px)); bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
  height: 54px; min-width: 54px; padding: 0 20px 0 18px; border-radius: 27px; border: 0; background: var(--visa); color: #fff;
  display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15.5px; box-shadow: 0 10px 24px -10px rgba(75, 68, 200, .7);
}
.fab svg { width: 24px; height: 24px; }
.fab:active { transform: scale(.97); }

/* ---------- typography blocks ---------- */
.section { margin-top: 26px; }
.section > h2, h2.sec { font-size: 17px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
.section > h2 .aside, h2.sec .aside { margin-inline-start: auto; font-size: 13.5px; font-weight: 500; color: var(--visa); background: none; border: 0; padding: 4px 0; }
.lead { font-size: 15px; color: var(--ink-2); margin: 4px 0 0; }

/* ---------- surfaces ---------- */
.card { background: var(--sheet); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.pad { padding: 16px; }
.list { background: var(--sheet); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; width: 100%; border: 0; background: none; text-align: start;
  border-top: 1px solid var(--rule);
}
.list > .row:first-child, .list > :first-child .row { border-top: 0; }
button.row:active, a.row:active { background: var(--paper-2); }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 13px; color: var(--ink-2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .end { color: var(--ink-3); font-size: 13.5px; flex: none; display: flex; align-items: center; gap: 6px; }
.row .chev { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.group-h { display: flex; align-items: baseline; gap: 8px; padding: 18px 4px 8px; font-weight: 700; font-size: 15px; }
.group-h .aside { margin-inline-start: auto; font-weight: 500; font-size: 13px; color: var(--ink-2); }

/* status ink dots and pills */
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.st-visited { --c: var(--visa); --cs: var(--visa-soft); }
.st-lived, .st-home { --c: var(--emerald); --cs: var(--emerald-soft); }
.st-home { --c: var(--carmine); --cs: var(--carmine-soft); }
.st-transit { --c: var(--slate); --cs: var(--paper-2); }
.st-wish, .st-planned { --c: var(--saffron); --cs: var(--saffron-soft); }
.st- { --c: var(--ink-3); --cs: var(--paper-2); }
.dot[class*="st-"] { background: var(--c); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; color: var(--c); background: var(--cs); white-space: nowrap; }

/* ---------- buttons, fields ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 0;
  background: var(--visa); color: #fff; font-weight: 600; font-size: 15.5px;
}
.btn svg { width: 20px; height: 20px; }
.btn.wide { width: 100%; }
.btn.ghost { background: var(--sheet); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rule); }
.btn.soft { background: var(--visa-soft); color: var(--visa-2); }
.btn.danger { background: var(--carmine-soft); color: var(--carmine); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn:disabled { opacity: .5; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns > .btn { flex: 1; }
.linkbtn { border: 0; background: none; color: var(--visa); font-weight: 600; padding: 6px 2px; }

label.field { display: block; margin-top: 14px; }
label.field > span.lab, .lab { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.input, select.input, textarea.input {
  width: 100%; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--rule); background: var(--sheet); padding: 10px 14px; font-size: 16px; outline: none;
}
textarea.input { min-height: 96px; resize: vertical; line-height: 1.6; }
.input:focus { border-color: var(--visa); box-shadow: 0 0 0 3px var(--visa-soft); }
.search {
  display: flex; align-items: center; gap: 8px; background: var(--sheet); border-radius: 14px; padding: 0 12px; min-height: 48px; box-shadow: inset 0 0 0 1.5px var(--rule);
}
.search svg { width: 20px; height: 20px; color: var(--ink-3); flex: none; }
.search input { flex: 1; border: 0; background: none; outline: none; min-height: 46px; font-size: 16px; min-width: 0; }
.search:focus-within { box-shadow: inset 0 0 0 2px var(--visa); }
.hint { font-size: 13px; color: var(--ink-2); margin: 6px 2px 0; }
.err { color: var(--carmine); font-size: 13.5px; margin: 6px 2px 0; }

.seg { display: flex; background: var(--paper-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; min-height: 38px; font-size: 14px; font-weight: 600; color: var(--ink-2); padding: 0 8px; }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg.mini { padding: 2px; border-radius: 10px; }
.seg.mini button { min-height: 28px; font-size: 12.5px; padding: 0 10px; border-radius: 8px; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 0 13px; min-height: 36px; font-size: 13.5px; font-weight: 600;
  background: var(--sheet); color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--rule); white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.chip .x { width: 16px; height: 16px; }

.toggle { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; border-top: 1px solid var(--rule); width: 100%; background: none; border-inline: 0; border-bottom: 0; text-align: start; }
.list > .toggle:first-child { border-top: 0; }
.toggle .grow { flex: 1; }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--rule); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: inset-inline-start .15s; }
[aria-checked="true"] > .switch { background: var(--visa); }
[aria-checked="true"] > .switch::after { inset-inline-start: 21px; }

.stars { display: inline-flex; gap: 2px; }

/* ---------- sheets & dialogs ---------- */

.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--paper); padding: 11px 16px; border-radius: 14px;

/* ---------- map ---------- */

/* ---------- country sheet ---------- */
.ctry-head { display: flex; align-items: center; gap: 14px; }

  mask: radial-gradient(circle var(--notch) at var(--cut) 0, transparent 98%, #000) top / 100% 51% no-repeat, radial-gradient(circle var(--notch) at var(--cut) 100%, transparent 98%, #000) bottom / 100% 51% no-repeat;
  --cut: calc(100% - 92px);
}
